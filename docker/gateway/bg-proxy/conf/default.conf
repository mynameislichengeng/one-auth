# bg-proxy —— 容器内蓝绿代理（Blue-Green Proxy）server 配置
# (git 控制，整目录 mount → /etc/nginx/conf.d/)
#
# 整个 docker/gateway/ 是网关配置总目录，下分两层：
#   docker/gateway/one-auth-vhost/   ← 外层（宿主机 nginx 的 vhost 模板，对外 HTTPS 入口）
#   docker/gateway/bg-proxy/         ← 本层（docker-compose 容器内 nginx，做蓝绿切换）
#
# 两层关系：
#   互联网 ─HTTPS─→ 宿主机 nginx (用 one-auth-vhost 模板部署，SSL 终结、域名分发)
#                ─HTTP─→ 此处 bg-proxy (蓝绿切换 upstream)
#                      ─HTTP─→ oneauth-blue/green:8080
# 本层职责：蓝绿切换 + 项目内 location 路由。SSL / 域名分发在外层。
#
# 顶部 include /etc/nginx/snippets/slot.conf
# slot.conf 由 ci-deploy.sh 在每次部署时 sed 渲染生成，里面定义 upstream oneauth_backend
# slot.conf 的 target 故意挂在 conf.d/ 之外（snippets/），避免 Docker 在仓库 conf/ 里建占位
#
# 生产规划（D-D10 + 02 文档）：
#   auth.licheng.cn          → 业务面（OAuth/OIDC 协议端点 + 登录页 + JWKS）
#   auth.admin.licheng.cn    → 管理面（admin SPA + admin BFF API，V0.3）
# 本地开发：default_server 兜底所有 host。

# ============ 蓝绿动态配置 ============
include /etc/nginx/snippets/slot.conf;

# ============ 日志格式 ============
# log_format 必须在 http 上下文（server 内非法）；保留这里
# access_log 故意不放 http 上下文：镜像默认 nginx.conf 在 http 顶层已经有
#   access_log /var/log/nginx/access.log main;
# 同级多条 access_log 会同时生效 → 每条请求写两次。
# 我们把 access_log 放到下面 server 块内，server 内的 access_log
# 会完全替换继承自 http 的，每条请求只写一份 combined_with_upstream 格式。
log_format  combined_with_upstream
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'upstream=$upstream_addr ut=$upstream_response_time rt=$request_time';
error_log   /var/log/nginx/error.log   warn;

# ============ 通用代理 headers ============
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;
proxy_set_header   Connection        "";
proxy_read_timeout  60s;
proxy_send_timeout  60s;

# ============ gzip ============
gzip            on;
gzip_min_length 1024;
gzip_types      application/json application/javascript text/css text/plain;

# ============ 安全 headers ============
add_header X-Content-Type-Options nosniff   always;
add_header X-Frame-Options        SAMEORIGIN always;
add_header Referrer-Policy        no-referrer-when-downgrade always;

# ============ 默认 server（本地兜底，生产由 server_name 区分） ============
server {
    listen      80 default_server;
    server_name _;

    # access_log 在 server 内定义 → 完全替换继承自 http 的（避免重复写日志）
    access_log /var/log/nginx/access.log combined_with_upstream;

    # OAuth/OIDC 协议端点
    location /oauth/        { proxy_pass http://oneauth_backend; }
    location /.well-known/  { proxy_pass http://oneauth_backend; }

    # 登录页 / Cookie session 入口
    location = /login   { proxy_pass http://oneauth_backend; }
    location = /logout  { proxy_pass http://oneauth_backend; }

    # V0.1 业务 API
    location /api/      { proxy_pass http://oneauth_backend; }

    # admin API（V0.3 接入）
    location /admin/    { proxy_pass http://oneauth_backend; }

    # 健康探针（不进 access log）
    location = /health  { proxy_pass http://oneauth_backend; access_log off; }
    location = /ready   { proxy_pass http://oneauth_backend; access_log off; }

    # 兜底
    location / { proxy_pass http://oneauth_backend; }
}

