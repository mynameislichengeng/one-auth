# oneauth server —— prod 业务参数
# 加载：APP_ENV=prod 时由 main.go 自动选取此文件
#
# 占位符使用原则：${VAR} 只用于 (1) secret (2) 部署元信息（每个实例不同）
# 产品/环境固定决策直接 hardcode，不绕一层 env 注入。
#
# 部署前必须通过 .env.prod 或 GitHub Actions secrets 注入：
#   DB_HOST / DB_PASSWORD / REDIS_ADDR / REDIS_PASSWORD
#   JWT_ISSUER / PUBLIC_BASE_URL
#   BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD

# 当前运行环境标识；启动时跟 APP_ENV 环境变量自检一致性
env: ${APP_ENV:-prod}

server:
  listen: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  shutdown_timeout: 30s
  # prod HTTPS 必须 true（cookie 仅 HTTPS 发送）
  cookie_secure: true
  # OIDC discovery 用的对外 base URL；prod 必须显式指定
  public_base_url: ${PUBLIC_BASE_URL}

database:
  host:     ${DB_HOST}                       # prod 必填，通常是 RDS endpoint
  port:     3306
  name:     oneauth
  username: oneauth
  password: ${DB_PASSWORD}
  # prod 连接池放大
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime: 1h

cache:
  driver: redis
  memory:
    default_ttl: 5m
    cleanup_interval: 10m
  redis:
    addr:     ${REDIS_ADDR}                  # prod 必填
    password: ${REDIS_PASSWORD}              # prod 必填
    db:       0

jwt:
  algorithm:           RS256
  private_key_path:    /app/keys/jwt-private.pem
  public_key_path:     /app/keys/jwt-public.pem
  issuer:              ${JWT_ISSUER}         # prod 必填，正式域名（如 https://auth.licheng.cn）
  access_token_ttl:    2h
  refresh_token_ttl:   720h    # 30 天
  auth_session_ttl:    24h     # SSO cookie session

password:
  min_length:         8
  # prod：bcrypt cost 标准 12（安全/性能平衡）
  bcrypt_cost:        12

ratelimit:
  # prod 严格防爆破/防撞库
  login_account_window:        15m
  login_account_max_failures:  5
  login_ip_window:             1h
  login_ip_max_failures:       100

migration:
  enabled: true

bootstrap:
  # prod 默认仍开启 bootstrap（首次启动创建 admin 账号），但邮箱 + 密码必填
  enabled:            true
  admin_email:        ${BOOTSTRAP_ADMIN_EMAIL}
  admin_password:     ${BOOTSTRAP_ADMIN_PASSWORD}
  admin_nickname:     "Platform Admin"

log:
  # prod：info + json 方便日志聚合
  level:  info
  format: json
