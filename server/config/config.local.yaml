# oneauth server —— local 业务参数
# 加载：APP_ENV=local 时由 main.go 自动选取此文件
# 格式说明：${VAR} 占位由 main.go 启动时从环境变量替换；${VAR:-default} 提供默认值

# 当前运行环境标识；启动时跟 APP_ENV 环境变量自检一致性
env: ${APP_ENV:-local}

server:
  listen: ${SERVER_LISTEN:-:8080}
  read_timeout: 10s
  write_timeout: 30s
  shutdown_timeout: 30s
  # dev 期 HTTP 必须 false，浏览器才接受 cookie
  cookie_secure: ${COOKIE_SECURE:-false}
  # OIDC discovery 用的对外 base URL；留空则从请求 Host 头推断
  public_base_url: ${PUBLIC_BASE_URL:-}

database:
  host:     ${DB_HOST:-localhost}
  port:     ${DB_PORT:-3306}
  name:     ${DB_NAME:-oneauth}
  username: ${DB_USERNAME:-oneauth}
  password: ${DB_PASSWORD}
  # local 默认连接池小一点
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 1h

cache:
  driver: ${CACHE_DRIVER:-memory}    # memory | redis
  memory:
    default_ttl: 5m
    cleanup_interval: 10m
  redis:
    addr:     ${REDIS_ADDR:-localhost:6379}
    password: ${REDIS_PASSWORD:-}
    db:       0

jwt:
  algorithm:           RS256
  private_key_path:    ${JWT_PRIVATE_KEY_PATH:-./keys/jwt-private.pem}
  public_key_path:     ${JWT_PUBLIC_KEY_PATH:-./keys/jwt-public.pem}
  issuer:              ${JWT_ISSUER:-oneauth-dev}
  access_token_ttl:    2h
  refresh_token_ttl:   720h    # 30 天
  auth_session_ttl:    24h     # SSO cookie session

password:
  min_length:         8
  # local：bcrypt cost 调低加快测试（每次 login 大约几 ms）
  bcrypt_cost:        10

ratelimit:
  # local 宽松，避免开发期被限流卡住
  login_account_window:        15m
  login_account_max_failures:  100
  login_ip_window:             1h
  login_ip_max_failures:       1000

migration:
  enabled:            ${MIGRATION_ENABLED:-true}

bootstrap:
  enabled:            ${BOOTSTRAP_ENABLED:-true}
  admin_email:        ${BOOTSTRAP_ADMIN_EMAIL:-admin@oneauth.local}
  admin_password:     ${BOOTSTRAP_ADMIN_PASSWORD}
  admin_nickname:     ${BOOTSTRAP_ADMIN_NICKNAME:-Platform Admin}

log:
  # local：debug + text 方便排障
  level:  ${LOG_LEVEL:-debug}
  format: ${LOG_FORMAT:-text}
